name: 🚀 Deploy Ferraco CRM - Full Stack

# Deploy automático do Ferraco CRM (Container Único - Frontend + Backend + Nginx)

concurrency:
  group: ferraco-deploy-vps
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VPS_HOST: '72.60.10.108'
  VPS_USER: 'root'
  APP_DIR: '/root/ferraco-crm'
  APP_PORT: '3050'
  COMPOSE_PROJECT: 'ferraco'
  DOMAIN: 'metalurgicaferraco.com'

jobs:
  deploy:
    name: 🚀 Deploy Full Stack para VPS
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🔑 Setup SSH Tools
      run: |
        echo "🔑 Instalando ferramentas SSH..."
        sudo apt-get update -q
        sudo apt-get install -y sshpass
        echo "✅ Ferramentas SSH instaladas"

    - name: 🔐 Validate Secrets
      run: |
        echo "🔐 Validando secrets obrigatórios..."

        # Validar VPS_PASSWORD (obrigatório)
        if [ -z "${{ secrets.VPS_PASSWORD }}" ]; then
          echo "❌ ERRO: VPS_PASSWORD não configurado!"
          echo "Configure em: Settings > Secrets and variables > Actions"
          exit 1
        fi
        echo "✅ VPS_PASSWORD configurado"

        # DATABASE_URL é opcional (pode ser configurado direto na VPS)
        if [ -n "${{ secrets.DATABASE_URL }}" ]; then
          echo "✅ DATABASE_URL configurado (será usado no build)"
        else
          echo "⚠️  DATABASE_URL não configurado (use .env na VPS ou configure o secret)"
        fi

        echo "✅ Validação de secrets concluída!"

    - name: 🔍 Pre-Deploy Validation
      run: |
        echo "🔍 Validando estrutura do projeto FERRACO CRM..."
        echo "📋 Arquitetura: Monorepo (apps/backend + apps/frontend)"
        echo ""
        echo "📦 Arquivos Docker essenciais:"
        ls -la Dockerfile docker-compose.vps.yml || { echo "❌ Docker files faltando!"; exit 1; }
        ls -la docker/nginx.conf docker/startup.sh || { echo "❌ Nginx/startup faltando!"; exit 1; }
        echo ""
        echo "📋 Backend (apps/backend/):"
        ls -la apps/backend/package.json apps/backend/src/ apps/backend/prisma/ || { echo "❌ Backend incompleto!"; exit 1; }
        echo ""
        echo "📋 Frontend (apps/frontend/):"
        ls -la apps/frontend/package.json apps/frontend/src/ apps/frontend/vite.config.ts || { echo "❌ Frontend incompleto!"; exit 1; }
        echo ""
        echo "✅ Estrutura monorepo validada!"

    - name: 📦 Prepare Deployment Package
      run: |
        echo "📦 Preparando pacote FERRACO CRM FULL STACK..."
        echo "  📦 Commit: ${{ github.sha }}"
        echo "  🌿 Branch: ${{ github.ref_name }}"
        echo "  👤 Actor: ${{ github.actor }}"
        echo "  🕐 Timestamp: $(date -u)"
        echo ""

        # Criar pacote compacto
        tar --warning=no-file-changed -czf deploy.tar.gz \
          --exclude='.git' \
          --exclude='**/node_modules' \
          --exclude='**/dist' \
          --exclude='**/build' \
          --exclude='*.log' \
          --exclude='coverage' \
          --exclude='.env.local' \
          --exclude='.env' \
          --exclude='**/.DS_Store' \
          --exclude='**/Thumbs.db' \
          . || true

        echo ""
        echo "📊 Tamanho do pacote:"
        ls -lh deploy.tar.gz
        echo "✅ Pacote criado com sucesso!"

    - name: 📤 Upload to VPS
      run: |
        echo "📤 Enviando pacote para VPS..."
        sshpass -p '${{ secrets.VPS_PASSWORD }}' scp \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ConnectTimeout=30 \
          deploy.tar.gz ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/tmp/
        echo "✅ Upload concluído!"

    - name: 🚀 Deploy on VPS
      run: |
        echo "🚀 Iniciando deploy na VPS..."

        sshpass -p '${{ secrets.VPS_PASSWORD }}' ssh \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=3 \
          -o ConnectTimeout=30 \
          ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << "DEPLOY_SCRIPT"
          set -e

          echo "========================================="
          echo "🚀 FERRACO CRM - Deploy Full Stack"
          echo "========================================="
          echo "📦 Commit: ${{ github.sha }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "👤 Actor: ${{ github.actor }}"
          echo "🕐 Timestamp: $(date)"
          echo "🎯 Arquitetura: Monorepo - Container Único"
          echo "🐳 Porta VPS: ${{ env.APP_PORT }}"
          echo "========================================="
          echo ""

          # Configurar sistema
          echo "📦 Atualizando sistema..."
          export DEBIAN_FRONTEND=noninteractive

          # Aguardar locks do apt e atualizar (com timeout de 3 minutos)
          echo "Aguardando locks do apt..."
          WAIT_COUNT=0
          MAX_WAIT=60  # 60 iterações * 3 segundos = 3 minutos

          while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
                fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
                fuser /var/lib/dpkg/lock >/dev/null 2>&1; do
            WAIT_COUNT=$((WAIT_COUNT + 1))
            if [ $WAIT_COUNT -ge $MAX_WAIT ]; then
              echo "  ⚠️  Timeout aguardando apt (3 minutos) - forçando continuação"
              # Matar processos que estão segurando o lock
              killall apt-get apt dpkg 2>/dev/null || true
              sleep 2
              break
            fi
            echo "  Apt está em uso, aguardando... ($WAIT_COUNT/$MAX_WAIT)"
            sleep 3
          done

          echo "Atualizando repositórios..."
          timeout 60 apt-get update -qq || echo "⚠️  Apt update timeout/error - continuando"

          echo "Instalando dependências..."
          timeout 60 apt-get install -y curl wget ca-certificates lsb-release psmisc 2>&1 | grep -v "^Setting up\|^Processing" || echo "⚠️  Algumas dependências podem não ter sido instaladas"

          echo "✅ Sistema atualizado"

          # Instalar/Atualizar Docker
          echo "🐳 Configurando Docker..."
          if ! command -v docker &> /dev/null; then
            echo "Instalando Docker..."
            curl -fsSL https://get.docker.com -o get-docker.sh
            sh get-docker.sh >/dev/null 2>&1
            rm get-docker.sh
            systemctl start docker
            systemctl enable docker
          fi
          docker --version

          # Verificar Docker Compose v2
          if ! docker compose version &> /dev/null; then
            echo "Instalando Docker Compose v2..."
            apt-get update -qq
            apt-get install -y docker-compose-plugin >/dev/null 2>&1
          fi
          docker compose version

          # Parar containers anteriores (SEM remover volumes - preserva banco de dados!)
          echo "⏹️  Parando containers anteriores..."
          # CORREÇÃO: Usar caminho absoluto para garantir que o docker-compose.vps.yml seja encontrado
          docker compose -f ${{ env.APP_DIR }}/docker-compose.vps.yml -p ${{ env.COMPOSE_PROJECT }} down --remove-orphans 2>/dev/null || true
          echo "✅ Volumes preservados (banco de dados mantido)"

          # Remover containers se ainda existirem
          docker rm -f ferraco-crm-vps 2>/dev/null || true
          docker rm -f ferraco-postgres 2>/dev/null || true

          # Liberar porta
          echo "🔓 Liberando porta ${{ env.APP_PORT }}..."
          fuser -k ${{ env.APP_PORT }}/tcp 2>/dev/null || true
          sleep 2

          # Limpar TUDO do Docker relacionado ao Ferraco (REBUILD COMPLETO ZERO)
          echo "🧹 Limpando COMPLETAMENTE Docker para rebuild zero..."

          # Remover imagens do Ferraco (todas as tags e layers)
          docker images --filter "reference=*ferraco*" -q | xargs -r docker rmi -f 2>/dev/null || true
          docker images | grep ferraco | awk '{print $3}' | xargs -r docker rmi -f 2>/dev/null || true

          # Limpar cache de build (layers intermediárias) - AGRESSIVO
          docker builder prune -a -f 2>/dev/null || true

          # Limpar networks órfãs
          docker network prune -f 2>/dev/null || true

          # IMPORTANTE: NÃO limpar volumes (preserva banco de dados PostgreSQL)
          echo "⚠️  Preservando volumes do PostgreSQL (banco de dados mantido)"
          # docker volume prune -f 2>/dev/null || true  # DESABILITADO - remove banco!
          # docker system prune -a -f 2>/dev/null || true  # DESABILITADO - remove volumes!

          echo "✅ Limpeza completa finalizada - preservando banco de dados PostgreSQL"

          # Limpeza COMPLETA do diretório (preserva apenas volumes Docker named)
          echo "🧹 Removendo COMPLETAMENTE código antigo..."
          if [ -d "${{ env.APP_DIR }}" ]; then
            cd /root
            rm -rf "${{ env.APP_DIR }}"
            echo "✅ Diretório ${{ env.APP_DIR }} removido completamente"
          fi

          # Recriar diretório limpo
          echo "📁 Criando diretório limpo..."
          mkdir -p ${{ env.APP_DIR }}
          cd ${{ env.APP_DIR }}

          # Extrair código
          echo "📦 Extraindo código novo..."
          tar -xzf /tmp/deploy.tar.gz
          rm -f /tmp/deploy.tar.gz
          echo "✅ Código extraído com sucesso"

          # Validar estrutura monorepo
          echo "🔍 Validando estrutura monorepo..."
          [ -f "Dockerfile" ] || { echo "❌ Dockerfile não encontrado!"; exit 1; }
          [ -f "docker-compose.vps.yml" ] || { echo "❌ docker-compose.vps.yml não encontrado!"; exit 1; }
          [ -d "docker" ] || { echo "❌ Pasta docker/ não encontrada!"; exit 1; }
          [ -f "docker/startup.sh" ] || { echo "❌ docker/startup.sh não encontrado!"; exit 1; }
          [ -f "docker/nginx.conf" ] || { echo "❌ docker/nginx.conf não encontrado!"; exit 1; }
          [ -d "apps/backend" ] || { echo "❌ Backend (apps/backend) não encontrado!"; exit 1; }
          [ -d "apps/frontend" ] || { echo "❌ Frontend (apps/frontend) não encontrado!"; exit 1; }
          [ -f "apps/backend/package.json" ] || { echo "❌ apps/backend/package.json não encontrado!"; exit 1; }
          [ -f "apps/frontend/package.json" ] || { echo "❌ apps/frontend/package.json não encontrado!"; exit 1; }
          [ -d "apps/backend/prisma" ] || { echo "❌ apps/backend/prisma não encontrado!"; exit 1; }

          # Validar que o código WhatsApp Web JS está presente (migrado do WPPConnect)
          echo "🔍 Validando integração WhatsApp (whatsapp-web.js)..."
          WHATSAPP_SERVICE="apps/backend/src/services/whatsappWebJS.service.ts"
          if [ -f "$WHATSAPP_SERVICE" ]; then
            echo "  ✅ whatsapp-web.js service presente"
          else
            echo "  ❌ ERRO: whatsappWebJS.service.ts não encontrado!"
            exit 1
          fi

          # Corrigir permissões dos scripts
          echo "🔧 Corrigindo permissões dos scripts..."
          chmod +x docker/startup.sh 2>/dev/null || true

          echo "✅ Estrutura monorepo validada!"

          # Named volumes Docker (não precisa criar diretórios locais)
          echo "ℹ️  Usando named volumes Docker (gerenciados automaticamente)"
          echo "   - ferraco-uploads (imagens persistentes)"
          echo "   - ferraco-sessions (WhatsApp persistente)"
          echo "   - ferraco-logs (logs persistentes)"
          echo "   - ferraco-data (dados gerais persistentes)"
          echo "   - postgres-data (banco de dados persistente)"

          # Configurar variáveis de ambiente para Docker
          echo "⚙️  Configurando ambiente Docker..."
          export BUILD_TIMESTAMP=$(date +%s)
          export GIT_COMMIT="${{ github.sha }}"
          export GIT_BRANCH="${{ github.ref_name }}"
          # T-35 (F-103): o JWT_SECRET era literal neste arquivo versionado
          # ("ferraco-vps-jwt-production-secret-2025"). Quem lesse o repositorio
          # podia forjar token de qualquer usuario, inclusive ADMIN.
          # Agora os segredos vem de /root/ferraco-secrets/.env, que fica FORA
          # de $APP_DIR — este diretorio e apagado com `rm -rf` a cada deploy.
          if [ ! -f /root/ferraco-secrets/.env ]; then
            echo "❌ /root/ferraco-secrets/.env nao existe."
            echo "   Crie-o na VPS com POSTGRES_PASSWORD e JWT_SECRET."
            echo "   Modelo: .env.vps.example (na raiz do repositorio)"
            exit 1
          fi
          set -a; . /root/ferraco-secrets/.env; set +a

          # Falha cedo e com mensagem clara, em vez de deixar o compose abortar
          # com um erro de interpolacao dificil de interpretar nos logs.
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ausente em /root/ferraco-secrets/.env}"
          : "${JWT_SECRET:?JWT_SECRET ausente em /root/ferraco-secrets/.env}"
          echo "✅ Segredos carregados de /root/ferraco-secrets/.env"

          export CORS_ORIGIN="https://${{ env.DOMAIN }},http://${{ env.VPS_HOST }}:${{ env.APP_PORT }}"
          export ALLOWED_ORIGINS="https://${{ env.DOMAIN }},http://${{ env.VPS_HOST }}:${{ env.APP_PORT }}"
          export LOG_LEVEL=info
          export NODE_ENV=production

          echo "📦 Build Info:"
          echo "   Commit: $GIT_COMMIT"
          echo "   Branch: $GIT_BRANCH"
          echo "   Timestamp: $BUILD_TIMESTAMP"

          # T-35: o DATABASE_URL NAO e mais exportado aqui.
          # O docker-compose.vps.yml o monta a partir de POSTGRES_PASSWORD, que
          # acabou de ser carregado do .env. Exportar um valor concorrente aqui
          # criaria duas fontes de verdade para a MESMA senha: se o secret
          # DATABASE_URL ficasse defasado, a aplicacao apontaria para uma senha
          # que o Postgres nao tem — e o erro so apareceria no runtime.

          # VERIFICAÇÃO DE VOLUMES CRÍTICOS (Solução 2 - Proteção contra perda de dados)
          echo ""
          echo "========================================="
          echo "🔒 VERIFICAÇÃO DE VOLUMES CRÍTICOS"
          echo "========================================="

          REQUIRED_VOLUMES="ferraco-postgres-data ferraco-uploads ferraco-sessions"
          VOLUMES_OK=true

          for VOLUME in $REQUIRED_VOLUMES; do
            if docker volume inspect $VOLUME >/dev/null 2>&1; then
              SIZE=$(docker run --rm -v ${VOLUME}:/data:ro alpine du -sh /data 2>/dev/null | cut -f1 || echo "N/A")
              echo "✅ Volume $VOLUME existe (tamanho: $SIZE)"
            else
              echo "⚠️  Volume $VOLUME NÃO existe - será criado automaticamente"
              # Não é erro crítico, Docker Compose criará o volume
            fi
          done

          echo "✅ Verificação de volumes concluída"

          # BACKUP AUTOMÁTICO DE VOLUMES (Solução 3 - Proteção contra perda de dados)
          echo ""
          echo "========================================="
          echo "💾 BACKUP AUTOMÁTICO DE VOLUMES"
          echo "========================================="

          BACKUP_DIR="/root/ferraco-volumes-backup-$(date +%Y%m%d-%H%M%S)"
          mkdir -p $BACKUP_DIR

          # Backup de uploads (imagens)
          if docker volume inspect ferraco-uploads >/dev/null 2>&1; then
            echo "📦 Backup de ferraco-uploads..."
            docker run --rm \
              -v ferraco-uploads:/data:ro \
              -v $BACKUP_DIR:/backup \
              alpine tar -czf /backup/uploads.tar.gz -C /data . 2>/dev/null || echo "  ⚠️  Volume vazio ou erro no backup"

            if [ -f "$BACKUP_DIR/uploads.tar.gz" ]; then
              UPLOAD_SIZE=$(du -sh $BACKUP_DIR/uploads.tar.gz | cut -f1)
              echo "  ✅ Backup criado: uploads.tar.gz ($UPLOAD_SIZE)"
            fi
          else
            echo "  ℹ️  Volume ferraco-uploads não existe, pulando backup"
          fi

          # Backup de sessions (WhatsApp)
          if docker volume inspect ferraco-sessions >/dev/null 2>&1; then
            echo "📦 Backup de ferraco-sessions..."
            docker run --rm \
              -v ferraco-sessions:/data:ro \
              -v $BACKUP_DIR:/backup \
              alpine tar -czf /backup/sessions.tar.gz -C /data . 2>/dev/null || echo "  ⚠️  Volume vazio ou erro no backup"

            if [ -f "$BACKUP_DIR/sessions.tar.gz" ]; then
              SESSION_SIZE=$(du -sh $BACKUP_DIR/sessions.tar.gz | cut -f1)
              echo "  ✅ Backup criado: sessions.tar.gz ($SESSION_SIZE)"
            fi
          else
            echo "  ℹ️  Volume ferraco-sessions não existe, pulando backup"
          fi

          echo ""
          echo "✅ Backup automático concluído em: $BACKUP_DIR"

          # Manter apenas últimos 5 backups
          echo "🧹 Limpando backups antigos (mantendo últimos 5)..."
          ls -dt /root/ferraco-volumes-backup-* 2>/dev/null | tail -n +6 | xargs -r rm -rf
          echo "✅ Limpeza de backups concluída"

          # Build da imagem
          echo ""
          echo "========================================="
          echo "🏗️  BUILDING IMAGEM DOCKER"
          echo "========================================="
          echo "🏗️  Building imagem Docker (isso pode levar alguns minutos)..."
          echo "   Build timestamp: $BUILD_TIMESTAMP"
          echo "   Git commit: $GIT_COMMIT"

          # T-11 (F-72): `--build-arg DATABASE_URL` foi REMOVIDO.
          # O Dockerfile não declara `ARG DATABASE_URL`, então o valor era
          # silenciosamente ignorado — o build nunca precisou dele. Pior: se
          # alguém adicionasse o ARG, a credencial do banco ficaria gravada
          # numa camada da imagem, legível por `docker history`.
          # A aplicação recebe DATABASE_URL em RUNTIME, via environment do
          # compose, que é o lugar correto.
          DOCKER_BUILDKIT=1 docker compose -f docker-compose.vps.yml -p ${{ env.COMPOSE_PROJECT }} build \
            --no-cache \
            --pull \
            --build-arg BUILD_TIMESTAMP=$BUILD_TIMESTAMP \
            --build-arg GIT_COMMIT=$GIT_COMMIT

          echo "✅ Imagem Docker construída com sucesso!"

          # Iniciar aplicação
          echo "🚀 Iniciando aplicação..."
          docker compose -f docker-compose.vps.yml -p ${{ env.COMPOSE_PROJECT }} up -d
        DEPLOY_SCRIPT

    - name: 🔍 Verificar e Configurar Aplicação
      run: |
        echo "🔍 Verificando e configurando aplicação..."

        sshpass -p '${{ secrets.VPS_PASSWORD }}' ssh \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=3 \
          -o ConnectTimeout=30 \
          ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << "VERIFY_DEPLOY_SCRIPT"
          set -e
          cd ${{ env.APP_DIR }}

          # Aguardar container iniciar
          echo "⏳ Aguardando container iniciar (30 segundos)..."
          sleep 30

          # Verificar se container está rodando
          echo "🔍 Verificando status do container..."
          docker ps -a | grep ferraco-crm-vps || echo "❌ Container não encontrado!"

          CONTAINER_STATUS=$(docker inspect -f '{{.State.Status}}' ferraco-crm-vps 2>/dev/null || echo "not-found")
          echo "📊 Status do container: $CONTAINER_STATUS"

          if [ "$CONTAINER_STATUS" != "running" ]; then
            echo "❌ ERRO: Container não está rodando!"
            echo "📋 Logs completos do container:"
            docker logs ferraco-crm-vps --tail 200 2>&1 || echo "Não foi possível obter logs"
            echo ""
            echo "📋 Docker compose logs:"
            docker compose -f docker-compose.vps.yml -p ${{ env.COMPOSE_PROJECT }} logs --tail 200 2>&1
            echo ""
            echo "📋 Estado detalhado do container:"
            docker inspect ferraco-crm-vps 2>&1 | grep -A 20 "State"
            exit 1
          fi

          echo "✅ Container está rodando!"

          # VERIFICAÇÃO CRÍTICA: Garantir que volumes estão montados corretamente
          echo ""
          echo "========================================="
          echo "🔍 VERIFICAÇÃO CRÍTICA DE VOLUMES"
          echo "========================================="

          # Verificar se /app/uploads é um volume montado (não diretório da imagem)
          echo "📦 Verificando montagem de /app/uploads..."
          UPLOAD_MOUNT=$(docker exec ferraco-crm-vps sh -c "mountpoint -q /app/uploads && echo 'mounted' || echo 'notmounted'" 2>/dev/null || echo "error")
          if [ "$UPLOAD_MOUNT" = "mounted" ]; then
            echo "  ✅ /app/uploads está montado como volume Docker"
          elif [ "$UPLOAD_MOUNT" = "notmounted" ]; then
            echo "  ⚠️  AVISO: /app/uploads NÃO é um volume montado (dados podem ser perdidos!)"
            echo "  📋 Verificando mounts do container:"
            docker inspect ferraco-crm-vps | grep -A 20 "Mounts" || echo "Erro ao inspecionar mounts"
          else
            echo "  ⚠️  Erro ao verificar montagem (container pode não estar pronto)"
          fi

          # Verificar se /app/sessions é um volume montado
          echo "📦 Verificando montagem de /app/sessions..."
          SESSION_MOUNT=$(docker exec ferraco-crm-vps sh -c "mountpoint -q /app/sessions && echo 'mounted' || echo 'notmounted'" 2>/dev/null || echo "error")
          if [ "$SESSION_MOUNT" = "mounted" ]; then
            echo "  ✅ /app/sessions está montado como volume Docker"
          elif [ "$SESSION_MOUNT" = "notmounted" ]; then
            echo "  ⚠️  AVISO: /app/sessions NÃO é um volume montado (sessões WhatsApp podem ser perdidas!)"
            echo "  📋 Verificando mounts do container:"
            docker inspect ferraco-crm-vps | grep -A 20 "Mounts" || echo "Erro ao inspecionar mounts"
          else
            echo "  ⚠️  Erro ao verificar montagem (container pode não estar pronto)"
          fi

          # Listar todos os volumes montados no container
          echo ""
          echo "📋 Volumes montados no container ferraco-crm-vps:"
          docker inspect ferraco-crm-vps --format='{{range .Mounts}}{{.Type}}: {{.Source}} -> {{.Destination}} ({{.Name}}){{"\n"}}{{end}}' || echo "Erro ao listar volumes"

          echo "✅ Verificação de volumes concluída"
          echo "========================================="
          echo ""

          # Verificar versão do código dentro do container
          echo ""
          echo "========================================="
          echo "🔍 VERIFICAÇÃO DE CÓDIGO NO CONTAINER"
          echo "========================================="
          echo "📦 Verificando versão do código dentro do container..."

          # Verificar build info (variáveis de ambiente)
          echo ""
          echo "📋 Build Info no Container:"
          docker exec ferraco-crm-vps sh -c "echo \"  Build Timestamp: \$BUILD_TIMESTAMP\"" || echo "  ⚠️  BUILD_TIMESTAMP não encontrado"
          docker exec ferraco-crm-vps sh -c "echo \"  Git Commit: \$GIT_COMMIT\"" || echo "  ⚠️  GIT_COMMIT não encontrado"

          # Verificar se o whatsapp-web.js está no container
          echo ""
          echo "🔍 Verificando whatsapp-web.js no container..."
          if docker exec ferraco-crm-vps test -f /app/backend/src/services/whatsappWebJS.service.ts 2>/dev/null; then
            echo "  ✅ whatsapp-web.js service PRESENTE no container (TypeScript)"
          elif docker exec ferraco-crm-vps test -f /app/backend/dist/services/whatsappWebJS.service.js 2>/dev/null; then
            echo "  ✅ whatsapp-web.js service PRESENTE no container (compilado)"
          else
            echo "  ❌ ERRO: whatsappWebJS.service não encontrado no container!"
            exit 1
          fi

          echo "✅ Verificação de código concluída"
          echo "========================================="

          # Mostrar logs iniciais
          echo ""
          echo "📋 Logs iniciais do container:"
          docker logs ferraco-crm-vps --tail 50

          # Executar migrations da API Externa (novas tabelas)
          echo ""
          echo "🗄️  Aplicando migrations da API Externa..."

          # Tentar aplicar migrations normalmente
          if ! docker exec ferraco-crm-vps sh -c "cd /app/backend && npx prisma migrate deploy" 2>&1 | tee /tmp/migration_output.txt; then
            echo "⚠️  Migrations falharam, verificando causa..."

            # Verificar se é erro P3009 (failed migrations)
            if grep -q "P3009\|failed migrations" /tmp/migration_output.txt; then
              echo "🔧 Detectado erro P3009 - migrations falhadas anteriormente"
              echo "📋 Resolvendo migrations falhadas automaticamente..."

              # Extrair nome da migration falhada
              FAILED_MIGRATION=$(grep "migration started at" /tmp/migration_output.txt | sed -n 's/.*The `\([^`]*\)` migration.*/\1/p')
              echo "📌 Migration falhada detectada: $FAILED_MIGRATION"

              # Tentar marcar como rolled-back primeiro
              echo "🔄 Tentando marcar como rolled-back..."
              docker exec ferraco-crm-vps sh -c "cd /app/backend && npx prisma migrate resolve --rolled-back $FAILED_MIGRATION" || true

              sleep 2

              # Tentar aplicar migrations novamente
              echo "🔄 Tentando aplicar migrations novamente..."
              if ! docker exec ferraco-crm-vps sh -c "cd /app/backend && npx prisma migrate deploy"; then
                echo "⚠️  Ainda com erro, marcando como aplicada (skip)..."
                docker exec ferraco-crm-vps sh -c "cd /app/backend && npx prisma migrate resolve --applied $FAILED_MIGRATION" || true

                sleep 2

                # Última tentativa
                echo "🔄 Última tentativa de aplicar migrations..."
                if ! docker exec ferraco-crm-vps sh -c "cd /app/backend && npx prisma migrate deploy"; then
                  echo "❌ Migrations falharam após todas as tentativas!"
                  echo "📋 Logs completos:"
                  docker logs ferraco-crm-vps --tail 100
                  exit 1
                fi
              fi
            else
              echo "❌ Erro diferente de P3009, abortando..."
              cat /tmp/migration_output.txt
              docker logs ferraco-crm-vps --tail 100
              exit 1
            fi
          fi

          echo "✅ Migrations aplicadas com sucesso!"

          # Gerar Prisma Client atualizado
          echo ""
          echo "🔄 Gerando Prisma Client..."
          docker exec ferraco-crm-vps sh -c "cd /app/backend && npx prisma generate" || {
            echo "❌ Erro ao gerar Prisma Client!"
            docker logs ferraco-crm-vps --tail 50
            exit 1
          }

          echo "✅ Migrations da API Externa aplicadas com sucesso!"

          # Aguardar serviços internos (Nginx + Backend)
          echo "⏳ Aguardando serviços internos (60 segundos)..."
          sleep 60

          # Verificar containers
          echo "🔍 Verificando containers..."
          docker compose -f docker-compose.vps.yml -p ${{ env.COMPOSE_PROJECT }} ps

          # Health check - USAR 127.0.0.1 NO ALPINE (localhost não funciona)
          echo "🩺 Executando health checks..."
          echo "⚠️  Usando 127.0.0.1 (Alpine Linux não resolve 'localhost')"
          echo "ℹ️  Backend serve /health (não /api/health)"

          MAX_TRIES=20
          HEALTH_OK=false

          echo ""
          echo "🔍 Health check da aplicação..."
          for i in $(seq 1 $MAX_TRIES); do
            if curl -f -s http://127.0.0.1:${{ env.APP_PORT }}/health >/dev/null 2>&1; then
              RESPONSE=$(curl -s http://127.0.0.1:${{ env.APP_PORT }}/health)
              echo "✅ Health check OK!"
              echo "   Response: $RESPONSE"
              HEALTH_OK=true
              break
            fi
            echo "  Tentativa $i/$MAX_TRIES - aguardando..."
            sleep 5
          done

          # Verificação de named volumes Docker
          echo ""
          echo "🔍 Verificando named volumes Docker..."
          echo "📦 Volumes criados/existentes:"
          docker volume ls --filter "name=ferraco" --format "table {{.Name}}\t{{.Driver}}\t{{.Mountpoint}}"

          # Verificar montagem de volumes no container
          echo ""
          echo "🔍 Verificando montagem de volumes no container..."
          docker exec ferraco-crm-vps ls -la /app/uploads 2>/dev/null || echo "⚠️  Diretório /app/uploads não acessível"
          docker exec ferraco-crm-vps ls -la /app/sessions 2>/dev/null || echo "⚠️  Diretório /app/sessions não acessível"
          docker exec ferraco-crm-vps ls -la /app/logs 2>/dev/null || echo "⚠️  Diretório /app/logs não acessível"
          docker exec ferraco-crm-vps ls -la /app/data 2>/dev/null || echo "⚠️  Diretório /app/data não acessível"

          echo ""
          echo "🔍 Testando permissões de escrita nos volumes..."
          docker exec ferraco-crm-vps touch /app/uploads/.test 2>/dev/null && \
            echo "✅ Volume /app/uploads com permissão de escrita" || \
            echo "❌ Volume /app/uploads SEM permissão de escrita"
          docker exec ferraco-crm-vps rm -f /app/uploads/.test 2>/dev/null || true

          docker exec ferraco-crm-vps touch /app/sessions/.test 2>/dev/null && \
            echo "✅ Volume /app/sessions com permissão de escrita" || \
            echo "❌ Volume /app/sessions SEM permissão de escrita"
          docker exec ferraco-crm-vps rm -f /app/sessions/.test 2>/dev/null || true

          # Verificar configuração do Express para servir arquivos estáticos
          echo ""
          echo "🔍 Verificando configuração do Express..."
          docker exec ferraco-crm-vps grep -r "express.static" /app/backend/dist/ 2>/dev/null | head -n 1 && \
            echo "✅ Express configurado para servir arquivos estáticos" || \
            echo "⚠️  Express pode não estar configurado corretamente"

          # Verificação final
          echo ""
          echo "========================================="
          if [ "$HEALTH_OK" = true ]; then
            echo "✅ DEPLOY CONCLUÍDO COM SUCESSO!"
          else
            echo "❌ FALHA NO DEPLOY - Health check não passou!"
          fi
          echo "========================================="

          # Validar container Docker
          echo ""
          echo "🔍 Validando container Docker..."
          CONTAINER_COUNT=$(docker ps --filter "name=ferraco-crm-vps" --format "{{.Names}}" | wc -l)
          if [ "$CONTAINER_COUNT" -eq "1" ]; then
            echo "✅ Container ferraco-crm-vps rodando"

            # Mostrar informações do container
            echo ""
            echo "📦 Status do Container:"
            docker ps --filter "name=ferraco-crm-vps" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            # Mostrar logs completos se health check falhou
            if [ "$HEALTH_OK" != true ]; then
              echo ""
              echo "📋 Logs completos do container (últimas 100 linhas):"
              docker compose -f docker-compose.vps.yml -p ${{ env.COMPOSE_PROJECT }} logs --tail 100
            fi
          else
            echo "❌ ERRO: Container não encontrado ou múltiplos containers!"
            echo "Containers ativos:"
            docker ps
          fi

          # Verificar processos PM2 (não deveria ter)
          if command -v pm2 &> /dev/null; then
            PM2_COUNT=$(pm2 list 2>/dev/null | grep -c "ferraco" || true)
            if [ "$PM2_COUNT" -eq "0" ]; then
              echo "✅ Nenhum processo PM2 do Ferraco (isolamento correto)"
            else
              echo "⚠️  AVISO: Existem $PM2_COUNT processos PM2 do Ferraco"
              echo "   Isso pode interferir com o Docker!"
              pm2 list
            fi
          fi

          echo ""
          echo "🔗 Links de Acesso:"
          echo "  🌐 Aplicação: http://${{ env.VPS_HOST }}:${{ env.APP_PORT }}"
          echo "  🔌 Backend API: http://${{ env.VPS_HOST }}:${{ env.APP_PORT }}/api"
          echo "  🩺 Health: http://${{ env.VPS_HOST }}:${{ env.APP_PORT }}/health"
          echo "  👨‍💼 Admin: http://${{ env.VPS_HOST }}:${{ env.APP_PORT }}/admin"
          echo "========================================="

          # Falhar se health check não passou
          if [ "$HEALTH_OK" != true ]; then
            echo ""
            echo "❌ Deploy falhou - health check não passou!"
            exit 1
          fi
        VERIFY_DEPLOY_SCRIPT

    - name: ✅ Post-Deploy Verification
      run: |
        echo ""
        echo "========================================="
        echo "✅ VERIFICAÇÃO PÓS-DEPLOY"
        echo "========================================="

        sshpass -p '${{ secrets.VPS_PASSWORD }}' ssh \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << "VERIFY_SCRIPT"
          set -e
          cd ${{ env.APP_DIR }}

          echo ""
          echo "🔍 1. Verificando Containers Docker..."
          docker ps --filter "name=ferraco" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo ""
          echo "🔍 2. Verificando Named Volumes Docker..."
          docker volume ls --filter "name=ferraco" --format "table {{.Name}}\t{{.Driver}}\t{{.Mountpoint}}"

          echo ""
          echo "🔍 3. Verificando Montagem no Container..."
          echo "   /app/uploads:"
          docker exec ferraco-crm-vps ls -lah /app/uploads | head -5 || echo "   ❌ Erro ao acessar /app/uploads"
          echo "   /app/sessions:"
          docker exec ferraco-crm-vps ls -lah /app/sessions | head -5 || echo "   ❌ Erro ao acessar /app/sessions"
          echo "   /app/logs:"
          docker exec ferraco-crm-vps ls -lah /app/logs | head -5 || echo "   ❌ Erro ao acessar /app/logs"
          echo "   /app/data:"
          docker exec ferraco-crm-vps ls -lah /app/data | head -5 || echo "   ❌ Erro ao acessar /app/data"

          echo ""
          echo "🔍 4. Testando Escrita nos Volumes..."
          docker exec ferraco-crm-vps sh -c "echo 'test' > /app/uploads/.deploy-test && rm /app/uploads/.deploy-test" && \
            echo "   ✅ Volume /app/uploads com escrita OK" || \
            echo "   ❌ Volume /app/uploads SEM permissão de escrita"
          docker exec ferraco-crm-vps sh -c "echo 'test' > /app/sessions/.deploy-test && rm /app/sessions/.deploy-test" && \
            echo "   ✅ Volume /app/sessions com escrita OK" || \
            echo "   ❌ Volume /app/sessions SEM permissão de escrita"

          echo ""
          echo "🔍 5. Verificando Endpoints..."
          echo "   /health:"
          curl -s http://127.0.0.1:${{ env.APP_PORT }}/health | head -c 100 && echo "" || echo "   ❌ Erro"
          echo "   /api/landing-page/config:"
          curl -s http://127.0.0.1:${{ env.APP_PORT }}/api/landing-page/config | head -c 150 && echo "..." || echo "   ❌ Erro"

          echo ""
          echo "🔍 6. Verificando API Externa (Swagger)..."
          echo "   /api-docs (Swagger UI):"
          curl -s -o /dev/null -w "   Status: %{http_code}\n" http://127.0.0.1:${{ env.APP_PORT }}/api-docs
          echo "   /api/openapi.json (OpenAPI Spec):"
          curl -s http://127.0.0.1:${{ env.APP_PORT }}/api/openapi.json | head -c 100 && echo "..." || echo "   ❌ Erro"

          echo ""
          echo "🔍 7. Verificando Tabelas da API Externa no Banco..."
          echo "   Tabelas esperadas: api_keys, api_usage_logs, webhooks, webhook_deliveries, event_logs"
          echo "   ✅ Verificação via migrations concluída"

          echo ""
          echo "🔍 8. Verificando Logs do Container (últimas 20 linhas)..."
          docker logs ferraco-crm-vps --tail 20

          echo ""
          echo "========================================="
          echo "✅ VERIFICAÇÃO CONCLUÍDA"
          echo "========================================="
        VERIFY_SCRIPT

