version: '3.8'

services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: dev
    container_name: ferraco-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000
      - WHATSAPP_SESSIONS_PATH=/app/sessions
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
      - backend-data:/app/prisma
      - whatsapp-sessions:/app/sessions
      - whatsapp-tokens:/app/tokens
    networks:
      - ferraco-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # T-11 (F-15): ATENÇÃO — `apps/frontend/Dockerfile` NÃO EXISTE no repositório.
  # Este serviço falha em `docker compose up`. O fluxo de desenvolvimento
  # suportado é `npm run dev` (Vite na porta 3000), não container.
  # Para usar este serviço, crie o Dockerfile com um stage `dev`.
  # Mantido declarado, e não removido, porque remover um serviço por suposição
  # poderia quebrar o fluxo de quem tenha o arquivo localmente.
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: dev
    container_name: ferraco-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    networks:
      - ferraco-network
    depends_on:
      - backend

networks:
  ferraco-network:
    driver: bridge

volumes:
  backend-data:
  whatsapp-sessions:
  whatsapp-tokens:
